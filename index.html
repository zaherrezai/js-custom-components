<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="main.js" defer></script>
    <script src="./component/custom-btn/custom-btn.js" defer></script>
    <link rel="stylesheet" href="./component/custom-btn/style.css">
    <script src="./component/custom-input/custom-input.js" defer></script>
    <link rel="stylesheet" href="./component/custom-input/style.css">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id = "container">
            <custom-input
                id="email"
                type="email"
                placeholder="Enter your email"
                width="400px"
                height="40px"
                radius="10px"
                bg-color="#ffffff"
                text-color="#3d0d6b">
            </custom-input>
            <custom-input
                id="password"
                type="password"
                placeholder="Enter your password"
                width="400px"
                height="40px"
                radius="10px"
                bg-color="#ffffff"
                text-color="#3d0d6b">
            </custom-input>

            <custom-btn
                id="loginButton"
                text="Login"
                width="400px"
                height="35px"
                radius="10px"
                bg-color="#3f0b63"
                text-color="#ffffff">
            </custom-btn>           
    </div>
</body>
</html>
